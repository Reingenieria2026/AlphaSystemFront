<div id="contanier" class="grid grid-cols-12 grid-rows-11 gap-1">
  <div id="top" class="row-span-12">
    <div class="contenido">
      <div class="logo" [routerLink]="['/']">
        <div class="imagen">
          <img src="../../../../assets/AlphSysLogo.png" alt="" />
        </div>
      </div>

      <!-- <div class="logo" [routerLink]="['/']">
        <div class="imagen">
          <img src="../../../../assets/logoDragon.png" alt="" />
        </div>
      </div> -->

      <div class="iconos">
        <div class="opciones">
          <div class="arriba">
            <a
              class="inicio"
              href="#"
              [routerLink]="['/usuario/perfil']"
              routerLinkActive="activo"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="24"
                height="24"
                color="#725b3a"
                fill="none"
              >
                <path
                  d="M3 11.9896V14.5C3 17.7998 3 19.4497 4.02513 20.4749C5.05025 21.5 6.70017 21.5 10 21.5H14C17.2998 21.5 18.9497 21.5 19.9749 20.4749C21 19.4497 21 17.7998 21 14.5V11.9896C21 10.3083 21 9.46773 20.6441 8.74005C20.2882 8.01237 19.6247 7.49628 18.2976 6.46411L16.2976 4.90855C14.2331 3.30285 13.2009 2.5 12 2.5C10.7991 2.5 9.76689 3.30285 7.70242 4.90855L5.70241 6.46411C4.37533 7.49628 3.71179 8.01237 3.3559 8.74005C3 9.46773 3 10.3083 3 11.9896Z"
                  stroke="#725b3a"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M15 21.5V16.5C15 15.0858 15 14.3787 14.5607 13.9393C14.1213 13.5 13.4142 13.5 12 13.5C10.5858 13.5 9.87868 13.5 9.43934 13.9393C9 14.3787 9 15.0858 9 16.5V21.5"
                  stroke="#725b3a"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span>Perfil</span>
            </a>

            <a
              class="opcion"
              href="#"
              [routerLink]="['/usuario/prestamos']"
              routerLinkActive="activo"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                <path d="M10.0001 17V7C10.0001 5.11438 10.0001 4.17157 9.41427 3.58579C8.82849 3 7.88568 3 6.00005 3C4.11444 3 3.17163 3 2.58584 3.58578C2.00006 4.17157 2.00005 5.11437 2.00004 6.99998L2 17C1.99999 18.8856 1.99999 19.8284 2.58577 20.4142C3.17156 21 4.11438 21 6.00003 21C7.88567 21 8.82849 21 9.41427 20.4142C10.0001 19.8284 10.0001 18.8856 10.0001 17Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M21.4558 15.7091L19.0473 7.19224C18.572 5.51165 18.3343 4.67135 17.6838 4.2617C17.6312 4.22861 17.5772 4.19796 17.5218 4.16986C16.8358 3.82199 15.9877 4.04691 14.2916 4.49674C12.5529 4.95783 11.6836 5.18838 11.2632 5.84738C11.2293 5.90053 11.198 5.95524 11.1693 6.01134C10.8134 6.70684 11.057 7.5682 11.5442 9.2909L13.9527 17.8078C14.428 19.4884 14.6657 20.3287 15.3162 20.7383C15.3688 20.7714 15.4228 20.802 15.4782 20.8301C16.1642 21.178 17.0123 20.9531 18.7084 20.5033C20.4471 20.0422 21.3164 19.8116 21.7368 19.1526C21.7707 19.0995 21.802 19.0448 21.8307 18.9887C22.1866 18.2932 21.943 17.4318 21.4558 15.7091Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M6 17H6.00898" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M2 7H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M17.9912 17.0034L17.9999 17.0011" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 9.00019L19 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <span>Préstamos</span>
            </a>

            <a
              class="opcion relative"
              href="#"
              [routerLink]="['/usuario/libros']"
              routerLinkActive="activo"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                <path d="M16 2V6M8 2V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M21 12.5V12C21 8.22876 21 6.34315 19.8284 5.17157C18.6569 4 16.7712 4 13 4H11C7.22876 4 5.34315 4 4.17157 5.17157C3 6.34315 3 8.22876 3 12V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M3 10H21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M17.5 20.5C18.4293 20.5 19.2402 19.993 19.671 19.2404M17.5 20.5C16.5707 20.5 15.7598 19.993 15.329 19.2404M17.5 20.5L17.5 22M17.5 15.5C18.4292 15.5 19.24 16.0069 19.6709 16.7593M17.5 15.5C16.5708 15.5 15.76 16.0069 15.3291 16.7593M17.5 15.5L17.5 14M21 15.9998L19.6709 16.7593M14 19.9998L15.329 19.2404M21 19.9998L19.671 19.2404M14 15.9998L15.3291 16.7593M19.6709 16.7593C19.8803 17.1249 20 17.5485 20 18C20 18.4514 19.8804 18.8749 19.671 19.2404M15.329 19.2404C15.1196 18.8749 15 18.4514 15 18C15 17.5485 15.1197 17.1249 15.3291 16.7593" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <span>Notificaciones</span>

              <!-- 🔴 Badge de notificaciones -->
                <span
    *ngIf="hasNotifications"
    class="notif-dot"
    aria-label="Tienes notificaciones nuevas"
    [attr.title]="unreadCount > 0 ? (unreadCount + ' nuevas') : 'Tienes notificaciones nuevas'">
    <iframe
      class="notif-anim"
      src="https://lottie.host/embed/9487ace3-503e-4237-870c-417c53f1880a/Eh6y5ABmQI.lottie"
      title="Animación de notificación"
      loading="lazy">
    </iframe>
  </span>
            </a>
          </div>

          <div class="abajo">
            <a
              *ngIf="user"
              class="logout-button opcion"
              (click)="logout()"
              [class.disabled]="logoutInProgress"
            >
              <div id="bot" class="cont">
                <ng-container id="bot" *ngIf="!logoutInProgress; else loading">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    color="#725b3a"
                    fill="none"
                  >
                    <path
                      d="M15 17.625C14.9264 19.4769 13.3831 21.0494 11.3156 20.9988C10.8346 20.987 10.2401 20.8194 9.05112 20.484C6.18961 19.6768 3.70555 18.3203 3.10956 15.2815C3 14.723 3 14.0944 3 12.8373L3 11.1627C3 9.90561 3 9.27705 3.10956 8.71846C3.70555 5.67965 6.18961 4.32316 9.05112 3.51603C10.2401 3.18064 10.8346 3.01295 11.3156 3.00119C13.3831 2.95061 14.9264 4.52307 15 6.37501"
                      stroke="#725b3a"
                      stroke-width="1.5"
                      stroke-linecap="round"
                    ></path>
                    <path
                      d="M21 12H10M21 12C21 11.2998 19.0057 9.99153 18.5 9.5M21 12C21 12.7002 19.0057 14.0085 18.5 14.5"
                      stroke="#725b3a"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                  <span>Cerrar sesión</span>
                </ng-container>
                <ng-template #loading>
                  <ng-lottie
                    id="cargar"
                    [options]="options"
                    style="width: 32px; height: 32px;"
                  ></ng-lottie>
                </ng-template>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="left" class="col-span-11">
    <div class="info">
      <div class="barraBusqueda">
        <!-- <span class="hora">{{ timeString }}</span> -->
      </div>
      <div class="perfil">
        <div *ngIf="user" class="estLogeado">
          <span class="flex items-center"></span>
        </div>
        <div *ngIf="!user" class="noEstaLogeado">
          <a id="tes" class="nav-link" href="#" [routerLink]="['/login']">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              color="#725b3a"
              fill="none"
            >
              <path
                d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z"
                stroke="#725b3a"
                stroke-width="1.5"
              ></path>
              <path
                d="M14.75 9.5C14.75 11.0188 13.5188 12.25 12 12.25C10.4812 12.25 9.25 11.0188 9.25 9.5C9.25 7.98122 10.4812 6.75 12 6.75C13.5188 6.75 14.75 7.98122 14.75 9.5Z"
                stroke="#725b3a"
                stroke-width="1.5"
              ></path>
              <path
                d="M5.49994 19.0001L6.06034 18.0194C6.95055 16.4616 8.60727 15.5001 10.4016 15.5001H13.5983C15.3926 15.5001 17.0493 16.4616 17.9395 18.0194L18.4999 19.0001"
                stroke="#725b3a"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
            <span>Iniciar sesión</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="center" class="col-span-11 row-span-11 col-start-2 row-start-2">
    <p-scrollpanel [style]="{ width: '100%', height: '685px' }">
      <router-outlet></router-outlet>
    </p-scrollpanel>
  </div>
</div>
