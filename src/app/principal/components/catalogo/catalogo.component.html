<div *ngIf="loading" class="spinner-overlay">
  <ng-lottie [options]="options" class="spinner"></ng-lottie>
</div>


<ng-container *ngIf="!loading">
<div class="contenedor">
  

  <div class="textoPrincipal">
    <div *ngIf="!busquedaIngresada" class="textPrin">
      <span class="titulo">Catálogo</span>
      <span class="subtitulo">Explora nuestro gran catálogo disponible solo para tí.</span>
    </div>
    <div *ngIf="busquedaIngresada" class="busqueda">
      <div class="titulo">Libros encontrados para " {{busquedaIngresada}} " </div>
    </div>
    <!-- <div class="genero">
      <div class="titulo">Libros del genero {{generoSeleccionado}}  </div>
    </div> -->
  </div>

  <div class="filtros">
    <p-splitButton [model]="generosMenu" rounded severity="help">
    <ng-template pTemplate="label">
      <span><i class="pi pi-fw pi-tags"></i> Géneros</span>
    </ng-template>
  </p-splitButton>

  <p-splitbutton [model]="estadosMenu" rounded severity="help">
  <ng-template pTemplate="label">
    <span class="btn-label">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24">
        <path d="M2 7L11 2L22 7V17L11 22L2 17V7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      Estado del libro
    </span>
  </ng-template>
</p-splitbutton>

<p-splitbutton [model]="datosLibroMenu" rounded severity="help">
  <ng-template pTemplate="label">
    <span class="btn-label">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24">
        <path d="M2 6C2 4.9 2.9 4 4 4H10V20H4C2.9 20 2 19.1 2 18V6ZM20 4H14V20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4Z" stroke="currentColor" stroke-width="2"/>
      </svg>
      Datos de libro
    </span>
  </ng-template>
</p-splitbutton>

<p-splitbutton [model]="ordenMenu" rounded severity="help">
  <ng-template pTemplate="label">
    <span class="btn-label">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24">
        <path d="M3 6H21M6 12H18M9 18H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Orden
    </span>
  </ng-template>
</p-splitbutton>

<p-button label="Borrar filtros" (onClick)="clearFilters()" [rounded]="true" severity="help" />
  </div>

  <!-- Aqui iran los chips de los filtros activos -->
  <div class="chips chips-container">
    <p-chip *ngFor="let chip of filterChips"
          [label]="chip.label"
          removable="true"
          (onRemove)="removeFilter(chip)">
  </p-chip>
  </div>


  <div class="catalogoCompleto">
    <div class="card">
      <p-dataview #dv [value]="paginatedBooks" [layout]="layout" [emptyMessage]="' '">
        <ng-template #header>
          <div class="flex justify-end">
            <p-selectbutton [(ngModel)]="layout" [options]="options1" [allowEmpty]="false">
              <ng-template #item let-item>
                <i class="pi" [ngClass]="{ 'pi-bars': item === 'list', 'pi-table': item === 'grid' }"></i>
              </ng-template>
            </p-selectbutton>
          </div>
        </ng-template>

        <ng-template #list let-items>
          <div *ngFor="let book of items; let first = first" [routerLink]="['/libro', book.isbn]"
          style="cursor: pointer;">
            <div  id="carta" class="flex flex-col sm:flex-row sm:items-center p-6 gap-4" [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }">
              <div class="md:w-40">
                <img class="block mx-auto rounded w-full" [src]="book.fotoUsr ? 'http://localhost:8000/storage/' + book.fotoUsr : 'assets/book_icon.png'" [alt]="book.titulo" />
              </div>
              <div class="flex flex-col flex-1 gap-2">
                <div class="text-lg font-medium">{{ book.titulo }}</div>
                <div class="text-sm">{{ book.autor }}</div>
              </div>
            </div>
          </div>
        </ng-template>

        <ng-template #grid let-items>
          <div id="cartad" class="grid grid-cols-15 gap-6">
            <div  id="carta" *ngFor="let book of items" class="col-span-12 sm:col-span-6 md:col-span-4 xl:col-span-3 p-2" [routerLink]="['/libro', book.isbn]"
            style="cursor: pointer;">
              <div id="cartadentro" class="p-6 border border-surface-200 bg-surface-0 rounded flex flex-col">
                <div class="bg-surface-50 flex justify-center rounded p-4" style="width:150px; height:230px;">
                  <img id="imagen" class="rounded" [src]="book.fotoUsr ? 'http://localhost:8000/storage/' + book.fotoUsr : 'assets/book_icon.png'" [alt]="book.titulo" style="width:200px; height:200px; object-fit: cover; object-position: center;" />
                </div>
                <div class="pt-6">
                  <div class="text-lg font-medium">{{ book.titulo }}</div>
                  <div class="text-sm">{{ book.autor }}</div>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </p-dataview>
    </div>
    <div *ngIf="filteredBooks.length === 0" class="text-center p-4 text-gray-600">
      No se encontraron libros :(
    </div>
  </div>

  <div class="paginator">
    <div class="card flex justify-center">
      <!-- Actualiza totalRecords usando filteredBooks.length y vincula (onPageChange) -->
      <p-paginator [first]="first" [rows]="rows" [totalRecords]="filteredBooks.length"
        [rowsPerPageOptions]="[5,10,15]" (onPageChange)="onPageChange($event)">
      </p-paginator>
    </div>
  </div>
</div>
</ng-container>
