                  </svg>
                  <span>Cerrar sesión</span>
                </ng-container>
                <ng-template #loading>
                  <ng-lottie
                    id="cargar"
                    [options]="options"
                    style="width: 32px; height: 32px;"
                  ></ng-lottie>
                </ng-template>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="left" class="col-span-5">
    <div class="info">
      <div class="barraBusqueda">
        <div class="busqueda">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            (keyup.enter)="search()"
            placeholder="Busca por nombre de libro, autor o ISBN"
          />
          <button (click)="search()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              color="#725b3a"
              fill="none"
            >
              <path
                d="M17 17L21 21"
                stroke="#725b3a"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
              <path
                d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"
                stroke="#725b3a"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="perfil">
        <div *ngIf="user" class="estLogeado">
          <span class="flex items-center">
            <img
              alt="logo"
              [src]="user.fotoUsr
                        ? 'http://localhost:8000/storage/' + user.fotoUsr
                        : 'assets/user_icon.png'"
              style="height: 3rem; margin-right: 0.5rem;"
              class="rounded-full aspect-square"
            />
            <span id="tes">{{user.nombreUsr + ' ' +user.apellidoP}}</span>
          </span>
        </div>
        <div *ngIf="!user" class="noEstaLogeado">
          <a id="tes" class="nav-link" href="#" [routerLink]="['/login']">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              color="#725b3a"
              fill="none"
            >
              <path
                d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z"
                stroke="#725b3a"
                stroke-width="1.5"
              ></path>
              <path
                d="M14.75 9.5C14.75 11.0188 13.5188 12.25 12 12.25C10.4812 12.25 9.25 11.0188 9.25 9.5C9.25 7.98122 10.4812 6.75 12 6.75C13.5188 6.75 14.75 7.98122 14.75 9.5Z"
                stroke="#725b3a"
                stroke-width="1.5"
              ></path>
              <path
                d="M5.49994 19.0001L6.06034 18.0194C6.95055 16.4616 8.60727 15.5001 10.4016 15.5001H13.5983C15.3926 15.5001 17.0493 16.4616 17.9395 18.0194L18.4999 19.0001"
                stroke="#725b3a"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
            <span>
              Iniciar sesión
            </span>
          </a>
        </div>
      </div>
    </div>

    
    <div class="papas">
      <div class="dentro">
        <div class="lottie">
          <ng-lottie
                    id="gato"
                    [options]="gato"
                    style="width: 10px; height: 10px;"
                  ></ng-lottie>
        </div>
        <div
          class="mensaje"
          *ngIf="visible"
          [@fadeInOut]
        >
          {{ letraMostrada }}
        </div>
      </div>
    </div>
  </div>
  <div id="center" class="col-span-5 row-span-4 col-start-2 row-start-2">
    <p-scrollpanel [style]="{ width: '100%', height: '590px' }">
      <router-outlet></router-outlet>
    </p-scrollpanel>
  </div>
</div>
