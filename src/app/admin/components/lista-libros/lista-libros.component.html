<p-confirmDialog />
<div class="body">
  
  <div class="titulo" @fadeUp>
    
    <span>LIBROS</span>
  </div>

  <div class="lista">
    
    <div class="usuarios">
      <div class="contenido">
        <p-table
          #dt
          [value]="libros"
          dataKey="isbn"
          [paginator]="true"
          [rows]="rows"
          [rowsPerPageOptions]="[8,12,16]"
          [loading]="loading"
          [globalFilterFields]="['isbn','titulo']"
          [filters]="filters"
          [tableStyle]="{ 'min-width': '30rem' }"
          
          scrollable="true"
          scrollHeight="460px"
          @fadeSimple
        >

          <!-- GLOBAL FILTER -->
          <ng-template pTemplate="caption">
            <div class="flex">
              <span class="p-input-icon-left ml-auto">
                <i class="pi pi-search"></i>
                <input
                  pInputText
                  type="text"
                  placeholder="Buscar ISBN o Título"
                  (input)="dt.filterGlobal($any($event.target).value,'contains')"
                />
              </span>
            </div>
          </ng-template>

          <!-- COLUMN DEFINITIONS -->
          <ng-template pTemplate="header">
            <tr>
              <th pSortableColumn="isbn">
                ISBN <p-sortIcon field="isbn"></p-sortIcon>
              </th>
              <th pSortableColumn="titulo">
                Título <p-sortIcon field="titulo"></p-sortIcon>
              </th>
              <th pSortableColumn="autor">
                Autor <p-sortIcon field="autor"></p-sortIcon>
              </th>
              <th pSortableColumn="edicion">
                Edición <p-sortIcon field="edicion"></p-sortIcon>
              </th>
              <th pSortableColumn="cantidad">
                Cantidad <p-sortIcon field="cantidad"></p-sortIcon>
              </th>
              <th>Estado</th>
              <th>Género</th>
              <th>Acciones</th>
            </tr>
            <tr>
              <th>
                
              </th>
              <th>
                
              </th>
              <th>
                
              </th>
              <th>
                
              </th>
              <th>
                
              </th>
<th>
  <p-columnFilter
    field="idEstadoLibro"
    matchMode="equals"
    [showMenu]="false"
  >
    <ng-template #filter let-value let-filter="filterCallback">
      <p-dropdown
        [options]="statusOptions" 
        [ngModel]="value"
        (ngModelChange)="filter($event)"
        placeholder="Estado"
        [showClear]="true"
      >
        <ng-template pTemplate="item" let-opt>
          <p-tag
            [value]="opt.label"
            [severity]="getSeverityById(opt.value)"
          ></p-tag>
        </ng-template>
      </p-dropdown>
    </ng-template>
  </p-columnFilter>
</th>

              <th>
                <p-columnFilter
                  field="idGenero"
                  matchMode="equals"
                  [showMenu]="false"
                >
                  <ng-template #filter let-value let-filter="filterCallback">
                    <p-dropdown
                      [options]="genreOptions"
                      [ngModel]="value"
                      (ngModelChange)="filter($event)"
                      placeholder="Género"
                      [showClear]="true"
                    ></p-dropdown>
                  </ng-template>
                </p-columnFilter>
              </th>
              <th></th>
            </tr>
          </ng-template>

          <!-- ROW TEMPLATE -->
          <ng-template pTemplate="body" let-libro>
            <tr (click)="viewDetails(libro.isbn)" class="clickable-row">
              <td>{{ libro.isbn }}</td>
              <td>{{ libro.titulo }}</td>
              <td>{{ libro.autor }}</td>
              <td>{{ libro.edicion }}</td>
              <td>{{ libro.cantidad }}</td>
              <td>
  <p-tag
    [value]="estadoLabel(libro.idEstadoLibro)"
    [severity]="getSeverityById(libro.idEstadoLibro)"
  ></p-tag>
</td>
              <td>
                <p-tag
                  [value]="genreMap[libro.idGenero]"
                  severity="secondary"
                ></p-tag>
              </td>
              <td>
  <td>
  <button
    pButton
    type="button"
    [icon]="!isEliminado(libro) ? 'pi pi-trash' : 'pi pi-replay'"
    [class.p-button-danger]="!isEliminado(libro)"
    [class.p-button-success]="isEliminado(libro)"
    class="p-button-rounded p-button-text"
    [title]="!isEliminado(libro) ? 'Eliminar libro' : 'Restaurar libro'"
    (click)="confirmarAccionLibro($event, libro); $event.stopPropagation()"
  ></button>
</td>
            </tr>
          </ng-template>

          <!-- EMPTY MESSAGE -->
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="8">No se encontraron libros.</td>
            </tr>
          </ng-template>

          <!-- LOADING ICON (opcional) -->
          <ng-template pTemplate="loadingicon">
            <ng-lottie
              [options]="spinner"
              style="width:80px; height:80px; margin:auto"
              autoplay
              loop
